apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
spec:
  rules:
  - http:
      paths:
      - path: /users
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 80
      - path: /orders
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 80
      - path: /payments
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 80
